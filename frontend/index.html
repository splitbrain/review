<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Review</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/api/chroma.css">
</head>
<body>
  <div class="app-layout">
    <!-- File Tree -->
    <nav class="file-tree">
      <div class="file-tree-header">
        <span>Files</span>
        <button class="new-review-btn" onclick="app.newReview()" title="Start a new review">New Review</button>
      </div>
      <div id="tree-container"></div>
    </nav>

    <!-- Code View -->
    <main class="code-view">
      <div class="commit-bar" id="commit-bar">
        <button class="secondary" id="commit-prev" title="Newer (toward HEAD)">&#9664;</button>
        <select id="commit-select" title="Choose the revision to review"></select>
        <button class="secondary" id="commit-next" title="Older">&#9654;</button>
        <span id="commit-subject" class="commit-subject"></span>
      </div>
      <div id="code-header" class="code-header">
        <span class="file-path">Select a file to review</span>
      </div>
      <div id="code-content" class="code-content">
        <div class="empty-state">
          <svg><use href="/static/assets/icons.svg#icon-comment"/></svg>
          <p>Select a file from the tree to start reviewing.</p>
          <small>Click on any line to add a comment.</small>
        </div>
      </div>
    </main>

    <!-- Comment Panel -->
    <aside class="comment-panel">
      <div class="comment-panel-header">
        <span>Comments</span>
      </div>
      <div id="comment-list" class="comment-list">
        <div class="empty-state" style="padding:2rem">
          <small>No file selected.</small>
        </div>
      </div>
      <div id="comment-editor" class="comment-editor" style="display:none">
        <div class="editor-header">
          <span id="editor-line-label">Line ?</span>
          <button class="secondary" onclick="app.closeEditor()" style="padding:0.2rem 0.5rem;font-size:0.75rem">Cancel</button>
        </div>
        <textarea id="editor-textarea" placeholder="Write your review comment..." rows="3"></textarea>
        <div class="editor-actions">
          <button onclick="app.saveComment()">Save</button>
          <button class="contrast" onclick="app.deleteComment()">Delete</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Status Bar -->
  <footer class="status-bar">
    <span id="ws-indicator" class="ws-indicator disconnected" title="Live updates disconnected"></span>
    <span id="status-md-path">REVIEW.md</span>
    <span id="status-base" style="display:none"></span>
    <span id="status-comment-count">0 comments</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
